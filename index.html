<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17395c">
  <title>COEDUCA · Instrumentos de evaluación</title>
  <meta http-equiv="refresh" content="3; url=evaluaciones/general/">
  <link rel="canonical" href="evaluaciones/general/">
  <style>
    :root {
      color-scheme: light;
      --navy: #17395c;
      --navy-deep: #0e263e;
      --sky: #56a9dc;
      --mint: #65bd9c;
      --ink: #10263b;
      --slate: #627488;
      --line: #dce5ed;
      --surface: rgba(255, 255, 255, 0.92);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 18%, rgba(86, 169, 220, 0.2), transparent 30rem),
        radial-gradient(circle at 84% 82%, rgba(101, 189, 156, 0.2), transparent 28rem),
        linear-gradient(145deg, #f6f9fc 0%, #edf3f7 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.42;
      background-image:
        linear-gradient(rgba(23, 57, 92, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 57, 92, 0.035) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .redirect-card {
      position: relative;
      z-index: 1;
      width: min(100%, 34rem);
      padding: clamp(1.6rem, 5vw, 2.7rem);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.86);
      border-radius: 1.25rem;
      background: var(--surface);
      box-shadow: 0 1.5rem 4rem rgba(14, 38, 62, 0.13), 0 0.25rem 1rem rgba(14, 38, 62, 0.06);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.7rem;
      color: var(--navy);
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand img {
      width: 2.65rem;
      height: 2.65rem;
      object-fit: contain;
      filter: drop-shadow(0 0.2rem 0.35rem rgba(14, 38, 62, 0.12));
    }

    .loader {
      position: relative;
      width: 4.5rem;
      height: 4.5rem;
      margin: 0 auto 1.5rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(86, 169, 220, 0.12), rgba(101, 189, 156, 0.15));
    }

    .loader::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 3px solid transparent;
      border-top-color: var(--sky);
      border-right-color: var(--mint);
      border-radius: inherit;
      animation: spin 1.15s linear infinite;
    }

    .loader svg {
      width: 1.9rem;
      height: 1.9rem;
      fill: none;
      stroke: var(--navy);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.65rem, 5vw, 2.15rem);
      line-height: 1.15;
      color: var(--navy-deep);
    }

    .message {
      max-width: 27rem;
      margin: 0.8rem auto 1.55rem;
      color: var(--slate);
      font-size: 0.96rem;
      line-height: 1.6;
    }

    .progress {
      height: 0.3rem;
      margin: 0 auto 1.5rem;
      overflow: hidden;
      border-radius: 999px;
      background: #e4ebf1;
    }

    .progress span {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--sky), var(--mint));
      animation: loading 1.15s ease-in-out infinite;
    }

    .open-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: 2.75rem;
      padding: 0.65rem 1.1rem;
      border: 1px solid var(--line);
      border-radius: 0.65rem;
      color: var(--navy);
      background: #fff;
      font-size: 0.87rem;
      font-weight: 650;
      text-decoration: none;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .open-link:hover {
      transform: translateY(-1px);
      border-color: rgba(23, 57, 92, 0.35);
      box-shadow: 0 0.45rem 1rem rgba(14, 38, 62, 0.09);
    }

    .open-link svg {
      width: 1rem;
      height: 1rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes loading {
      0% { transform: translateX(-115%); }
      55%, 100% { transform: translateX(240%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader::before, .progress span { animation: none; }
      .progress span { width: 100%; }
      .open-link { transition: none; }
    }
  </style>
  <script>
    window.setTimeout(function () {
      window.location.replace('evaluaciones/general/');
    }, 1200);
  </script>
</head>
<body>
  <main class="redirect-card" aria-labelledby="redirect-title">
    <div class="brand">
      <img src="evaluaciones/general/logo.png" alt="" aria-hidden="true">
      <span>COEDUCA</span>
    </div>

    <div class="loader" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"></path>
        <path d="M9 7h7M9 11h7"></path>
      </svg>
    </div>

    <h1 id="redirect-title">Preparando tu espacio de trabajo</h1>
    <p class="message">Estamos abriendo el generador de instrumentos y documentos de evaluación.</p>

    <div class="progress" role="progressbar" aria-label="Cargando el generador">
      <span></span>
    </div>

    <a class="open-link" href="evaluaciones/general/">
      Abrir ahora
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </a>
  </main>
</body>
</html>
